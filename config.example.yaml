# ============================================================================
# research_stage_00 — the single file you edit.
#
# setup_colab.sh copies this to config.yaml (gitignored) if it does not exist.
# Nothing operational is hardcoded in src/ — if you want to change it between
# runs, it belongs here.
#
# Override precedence:  CLI flag  >  MMRO_* env var  >  config.yaml  >  defaults
#   e.g.  MMRO_PATHS__CACHE_MODE=local python -m mmro.smoke --model qwen2_5_vl_7b
#
# Unknown keys are HARD ERRORS, not warnings. A typo that silently reverted to
# a default would invalidate an entire sweep or benchmark run.
# ============================================================================

# Every path is stated here and nowhere else. Nothing mounts Google Drive for
# you -- mount it yourself, then point hf_home at the result.
paths:
  # drive: cache weights on Drive so they survive a Colab restart, and stage
  #        them to stage_dir before loading.
  # local: cache on local disk; re-downloads each session, no staging copy.
  cache_mode: drive

  hf_home: /content/drive/MyDrive/MMRM/hf_cache   # used when cache_mode: drive
  local_hf_home: /content/MMRM/hf_cache           # used when cache_mode: local

  # Weights are staged here before loading when cache_mode is drive. Drive is a
  # FUSE mount; mmap-ing multi-shard safetensors across it is slow and stalls.
  stage_dir: /content/MMRM/models

  # Relative paths resolve against the repo root.
  images_dir: assets/heldout
  results_dir: results

runtime:
  dtype: bfloat16                  # bfloat16 | float16 | float32
  attn_implementation: sdpa        # sdpa | flash_attention_2 | eager
                                   #   flash_attention_2 needs a PREBUILT wheel;
                                   #   building it on Colab costs ~30 minutes.
  device_map: cuda:0
  seed: 0
  min_free_drive_gb: 50

# Shared decoding defaults. Sections below may override individual fields.
decode:
  do_sample: false                 # greedy -- cross-harness comparison requires it
  temperature: 0.0
  max_new_tokens: 256

# ----------------------------------------------------------------------------
# Model registry. `enabled: false` skips a model everywhere: fetch, smoke,
# sweep, and eval. `adapter` selects the implementation class in src/mmro/models.
# ----------------------------------------------------------------------------
models:
  qwen2_5_vl_7b:
    enabled: true
    adapter: qwen25vl
    repo_id: Qwen/Qwen2.5-VL-7B-Instruct
    budget:
      # 1 visual token = a 28x28 px block (14px patch, 2x2 merge).
      # qwen-vl-utils defaults to 16384 tokens for ONE image; we always set this
      # explicitly rather than inherit that ceiling.
      #
      # MEASURED ON L4 (stage 0, --all-rungs): Qwen has NO comprehension cliff.
      # It identified every image correctly at every rung up to its VRAM limit
      # (24,239 tok at 3 images), so the usable limit IS the VRAM limit.
      # Two numbers bound the choice:
      #   * VRAM  : 24,192 tok total ran at 20.6GB; above that it OOMs.
      #   * STYLE : below ~2,500 tok/image the output degenerates into terse,
      #             lowercase fragments -- still correct, but poor for a judge
      #             to parse. 1,231 tok/img was terse; 2,506 was well-formed.
      # 2560 puts the MMMU worst case (7 images = 17,920 tok, ~19.3GB) inside
      # both bounds. See docs/qwen-vs-internvl.md for the full derivation.
      max_visual_tokens_per_image: 2560
      min_pixels: 3136
      # Stage-0 measured TOTAL ceiling across all images in one prompt. Stage
      # 0.2 divides this by a task's max_images to get its per-image budget.
      # Qwen's ceiling is VRAM: 24,192 tok ran at 20.6GB, 30,312 OOM'd. 20,000
      # leaves margin for fragmentation.
      safe_total_visual_tokens: 20000

  internvl3_8b_hf:
    enabled: true
    adapter: internvl3_hf
    repo_id: OpenGVLab/InternVL3-8B-hf
    budget:
      # 448px tiles, 256 tokens/tile after pixel shuffle, +1 thumbnail tile.
      #
      # MEASURED ON L4 (stage 0, --all-rungs): InternVL has a COMPREHENSION
      # CLIFF far below its VRAM limit, and only on multi-image prompts.
      #   * VRAM limit    : 30,720 tokens ran fine at 21.0GB.
      #   * QUALITY limit : every multi-image cell was correct at <= 14,336
      #                     tokens; the first failure is at 14,848, and
      #                     everything >= 18,944 fails.
      # Past the cliff it drops an image entirely and describes the remaining
      # ones as if they were all it was given -- fluent, confident, wrong. It
      # does NOT OOM and does NOT error. Single-image was correct at every rung
      # tested (up to 28,416 tokens), so this is specific to multi-image.
      #
      # Therefore budget on TOKENS, not on max_tiles: 6 keeps the MMMU worst
      # case (7 images x 7 tiles x 256 = 12,544 tokens) inside the verified-
      # correct region. max_tiles: 8 would reach 16,128 -- past the cliff.
      # See docs/qwen-vs-internvl.md for the full derivation.
      max_tiles: 6
      use_thumbnail: true
      # InternVL's ceiling is COMPREHENSION, not VRAM: every multi-image cell
      # was correct at <= 14,336 tok and wrong from 14,848 up, while VRAM
      # allowed 30,720. Budget against the lower number.
      safe_total_visual_tokens: 14336

  internvl3_8b_native:
    # Fallback. Enable if the -hf path misbehaves on multi-image, or when you
    # need exact parity with InternVL3's published benchmark numbers.
    enabled: false
    adapter: internvl3_native
    repo_id: OpenGVLab/InternVL3-8B
    trust_remote_code: true
    budget:
      max_tiles: 6
      use_thumbnail: true

# Constraints on the held-out set in paths.images_dir.
images:
  # Stage 0 measures where high-resolution input breaks. Below this floor the
  # images, not the model, become the limit: the sweep's top rungs stop binding
  # and it reports a "boundary" that was never actually tested. 02_sweep.sh
  # refuses to run on a set below this unless you pass --allow-small-images.
  # 2048 is a floor, not a target -- prefer 4K+ originals.
  min_long_side: 2048

smoke:
  prompt: "Describe this image in detail."
  multi_image_prompt: "Compare these images. What differs between them?"
  image_counts: [1, 3]

sweep:
  # Budget for the WORST case a benchmark contains, not the average. MMMU's
  # schema allows up to 7 images in one question; most items have one, but the
  # single 7-image item is what OOMs an otherwise finished run. Consider
  # [1, 2, 4, 7] before stage 0.2 -- each extra count costs a full ladder walk,
  # so it is a deliberate trade rather than a free default.
  image_counts: [1, 2, 3, 4]
  max_new_tokens: 64               # overrides decode.max_new_tokens

  # Descending ladders, walked high to low until a run survives. The highest
  # surviving rung is the measured boundary for that model at that image count.
  #
  # THE TOP RUNG MUST BE HIGH ENOUGH TO OOM. If a cell survives at the top rung,
  # the sweep found the top of this list -- a number we chose -- not the limit of
  # the hardware, and it will say so and exit non-zero rather than report it as a
  # boundary. Raise these until something fails.
  #
  # Sizing, from measured L4 data (~15.5GB weights, ~0.21GB per 1k visual tokens,
  # so ~33k tokens to exhaust 22.5GB usable): at 4 images that needs ~8k tokens
  # per image, which is why the top rung is 10240 and not 4096.
  #
  # A rung above the image's native token count does nothing -- a 4K image is
  # ~10,550 tokens, so rungs beyond that stop binding. Going higher only helps
  # with 8K+ originals.
  qwen_visual_token_ladder: [40960, 20480, 10240, 8192, 6144, 4096, 2560, 1280]

  # InternVL tiles: 12 is the model's usual maximum, so rungs above it are
  # outside its tuned regime and captions may degrade before VRAM does -- which
  # is itself worth knowing.
  #
  # Note this ladder may legitimately never OOM. Tiles are capped by aspect
  # ratio, so a 16:9 image uses ~28 tiles even when 32 are allowed; reaching the
  # ~38k tokens an L4 needs would take ~45 tiles per image, which is far outside
  # anything you would actually run. "No boundary within the usable range" is a
  # real and useful stage-0 answer -- it means MMMU multi-image fits at full tile
  # budget -- and the sweep now reports it as such instead of as a boundary.
  internvl_tile_ladder: [256, 128, 96, 72, 64, 48, 40, 32, 24, 16, 12, 8, 6, 4, 2, 1]

# ----------------------------------------------------------------------------
# STAGE 0.2. Surface is defined now so the architecture is ready; unused while
# enabled: false. Both harnesses run the same tasks and their scores are
# compared -- deltas are expected and are the research output, not a bug.
# ----------------------------------------------------------------------------
eval:
  enabled: true                   # set true to run stage 0.2
  max_new_tokens: 512

  # The gate: how far a score may sit from the published baseline and still pass.
  gate_tolerance: 2.0

  # NOTE ON PATHS: venv and repo_dir MUST be on local disk, never on Google
  # Drive. A virtualenv needs symlinks and `ensurepip` needs normal file
  # semantics; Drive's FUSE mount provides neither, and `python -m venv` fails
  # with an ensurepip error. (A git clone succeeds there because it only writes
  # regular files -- which is why the failure appears halfway through setup.)
  # These are rebuilt each Colab session; work_dir stays on Drive so results
  # survive. scripts/03_setup_harness.sh checks this before it wastes your time.
  harnesses:
    vlmevalkit:
      enabled: true
      venv: /content/MMRM/venvs/vlmevalkit
      repo: https://github.com/open-compass/VLMEvalKit
      repo_dir: /content/MMRM/src/VLMEvalKit
      work_dir: results/vlmevalkit
      # The harness's OWN registered name for the model. For the gate we run
      # the harness's own implementation, because that is what produced the
      # published numbers; swapping in our adapter adds a variable and belongs
      # in a separate comparison AFTER the gate passes.
      model_id: Qwen2.5-VL-7B-Instruct
      # Command template. Placeholders: {python} {repo_dir} {work_dir}
      # {task_id} {task} {model_id} {model_path} {max_new_tokens}.
      # VERIFY against the VLMEvalKit README for your commit -- its CLI moves
      # between releases, and this is a string in config precisely so a change
      # there does not mean patching code.
      #
      # NOTE on eval.limit: VLMEvalKit's run.py has NO flag to cap the number of
      # samples per dataset (checked against its current argparse -- --debug
      # only changes process mode, not sample count). {limit} is deliberately
      # NOT in this template because there is nothing to put it into; setting
      # eval.limit has ZERO effect here and the full split always runs. lmms_eval
      # (below) genuinely supports --limit, so use that harness for a quick
      # shakeout, or pre-subset VLMEvalKit's cached TSV yourself.
      command: "{python} {repo_dir}/run.py --data {task_id} --model {model_id} --work-dir {work_dir}"
      # VLMEvalKit imports its whole dataset registry on `import vlmeval`, so a
      # single missing optional dep stops run.py before it reaches your task.
      # The setup script runs this and resolves what is missing in one pass.
      import_probe: "import vlmeval"
      python_bin: ""               # e.g. python3.11 if a dep lacks a wheel

    lmms_eval:
      enabled: true
      venv: /content/MMRM/venvs/lmms_eval        # local disk — see note above
      repo: https://github.com/EvolvingLMMs-Lab/lmms-eval
      repo_dir: /content/MMRM/src/lmms-eval
      work_dir: results/lmms_eval
      model_id: qwen2_5_vl
      # {limit} expands to "" when eval.limit is null, or "--limit N" when set
      # -- lmms_eval's own CLI genuinely supports --limit (unlike VLMEvalKit's,
      # see the note above), so this is the harness to use for a quick shakeout.
      command: "{python} -m lmms_eval --model {model_id} --model_args pretrained={model_path} --tasks {task_id} --batch_size 1 --log_samples --write_out --output_path {work_dir} {limit}"
      # Importing the model module is what fails (it pulls decord even for
      # image-only tasks), so probe that rather than just the package.
      import_probe: "import lmms_eval; import lmms_eval.models.simple.qwen2_5_vl"
      # decord has no wheel for Python 3.12+. If eva-decord also fails to
      # install, set this to python3.11 and rebuild with --rebuild.
      python_bin: ""

  # One row per benchmark, carrying BOTH harnesses' task IDs -- the two projects
  # name the same benchmark differently. This mapping is what makes the
  # cross-harness comparison meaningful, so it lives in config where it can be
  # corrected without touching code.
  #
  # max_images: the most images ONE question can contain. It divides the model's
  #   measured safe token total into a per-image budget. Getting this wrong is a
  #   silent accuracy loss: a single-image benchmark given the 7-image budget
  #   sees every chart needlessly downscaled.
  # baseline: published Qwen2.5-VL-7B-Instruct score, in percent.
  #   *** VERIFY THESE against the official model card before trusting the gate.
  #   A wrong baseline turns the gate into noise in either direction. ***
  tasks:
    - name: mmmu_val
      vlmevalkit: MMMU_DEV_VAL     # NOTE: spans dev+validation
      lmms_eval: mmmu_val          # NOTE: validation only -- a real split
                                   # difference, and a likely source of delta
      max_images: 7
      baseline: 58.6
    - name: mathvista_testmini
      vlmevalkit: MathVista_MINI
      lmms_eval: mathvista_testmini
      max_images: 1                # single-image: gets the whole token budget
      baseline: 68.2

  limit: 25                      # cap samples per task for a quick shakeout;
                                   # MUST be null for a gated run

  # MMMU and MathVista open-ended items need LLM answer extraction, and the
  # published numbers were produced WITH it. Leaving this at 'none' falls back
  # to rule-based matching, which systematically under-scores -- often by more
  # than the 2-point gate allows. Set this before a gated run.
  judge:
    backend: none                  # none | api | local
    model: null                    # e.g. gpt-4o-mini, or a local model id
    api_key_env: null              # env var holding the key, e.g. OPENAI_API_KEY
