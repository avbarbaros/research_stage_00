# ============================================================================
# research_stage_00 — the single file you edit.
#
# setup_colab.sh copies this to config.yaml (gitignored) if it does not exist.
# Nothing operational is hardcoded in src/ — if you want to change it between
# runs, it belongs here.
#
# Override precedence:  CLI flag  >  MMRO_* env var  >  config.yaml  >  defaults
#   e.g.  MMRO_PATHS__CACHE_MODE=local python -m mmro.smoke --model qwen2_5_vl_7b
#
# Unknown keys are HARD ERRORS, not warnings. A typo that silently reverted to
# a default would invalidate an entire sweep or benchmark run.
# ============================================================================

# Every path is stated here and nowhere else. Nothing mounts Google Drive for
# you -- mount it yourself, then point hf_home at the result.
paths:
  # drive: cache weights on Drive so they survive a Colab restart, and stage
  #        them to stage_dir before loading.
  # local: cache on local disk; re-downloads each session, no staging copy.
  cache_mode: drive

  hf_home: /content/drive/MyDrive/MMRM/hf_cache   # used when cache_mode: drive
  local_hf_home: /content/MMRM/hf_cache           # used when cache_mode: local

  # Weights are staged here before loading when cache_mode is drive. Drive is a
  # FUSE mount; mmap-ing multi-shard safetensors across it is slow and stalls.
  stage_dir: /content/MMRM/models

  # Relative paths resolve against the repo root.
  images_dir: assets/heldout
  results_dir: results

runtime:
  dtype: bfloat16                  # bfloat16 | float16 | float32
  attn_implementation: sdpa        # sdpa | flash_attention_2 | eager
                                   #   flash_attention_2 needs a PREBUILT wheel;
                                   #   building it on Colab costs ~30 minutes.
  device_map: cuda:0
  seed: 0
  min_free_drive_gb: 50

# Shared decoding defaults. Sections below may override individual fields.
decode:
  do_sample: false                 # greedy -- cross-harness comparison requires it
  temperature: 0.0
  max_new_tokens: 256

# ----------------------------------------------------------------------------
# Model registry. `enabled: false` skips a model everywhere: fetch, smoke,
# sweep, and eval. `adapter` selects the implementation class in src/mmro/models.
# ----------------------------------------------------------------------------
models:
  qwen2_5_vl_7b:
    enabled: true
    adapter: qwen25vl
    repo_id: Qwen/Qwen2.5-VL-7B-Instruct
    budget:
      # 1 visual token = a 28x28 px block (14px patch, 2x2 merge).
      # The library default permits 16384 tokens for ONE image -- guaranteed OOM
      # on a 24GB L4. We always set this explicitly.
      max_visual_tokens_per_image: 1280
      min_pixels: 3136

  internvl3_8b_hf:
    enabled: true
    adapter: internvl3_hf
    repo_id: OpenGVLab/InternVL3-8B-hf
    budget:
      # 448px tiles, 256 tokens/tile after pixel shuffle, +1 thumbnail tile.
      max_tiles: 6
      use_thumbnail: true

  internvl3_8b_native:
    # Fallback. Enable if the -hf path misbehaves on multi-image, or when you
    # need exact parity with InternVL3's published benchmark numbers.
    enabled: false
    adapter: internvl3_native
    repo_id: OpenGVLab/InternVL3-8B
    trust_remote_code: true
    budget:
      max_tiles: 6
      use_thumbnail: true

# Constraints on the held-out set in paths.images_dir.
images:
  # Stage 0 measures where high-resolution input breaks. Below this floor the
  # images, not the model, become the limit: the sweep's top rungs stop binding
  # and it reports a "boundary" that was never actually tested. 02_sweep.sh
  # refuses to run on a set below this unless you pass --allow-small-images.
  # 2048 is a floor, not a target -- prefer 4K+ originals.
  min_long_side: 2048

smoke:
  prompt: "Describe this image in detail."
  multi_image_prompt: "Compare these images. What differs between them?"
  image_counts: [1, 3]

sweep:
  # Budget for the WORST case a benchmark contains, not the average. MMMU's
  # schema allows up to 7 images in one question; most items have one, but the
  # single 7-image item is what OOMs an otherwise finished run. Consider
  # [1, 2, 4, 7] before stage 0.2 -- each extra count costs a full ladder walk,
  # so it is a deliberate trade rather than a free default.
  image_counts: [1, 2, 3, 4]
  max_new_tokens: 64               # overrides decode.max_new_tokens

  # Descending ladders, walked high to low until a run survives. The highest
  # surviving rung is the measured boundary for that model at that image count.
  #
  # THE TOP RUNG MUST BE HIGH ENOUGH TO OOM. If a cell survives at the top rung,
  # the sweep found the top of this list -- a number we chose -- not the limit of
  # the hardware, and it will say so and exit non-zero rather than report it as a
  # boundary. Raise these until something fails.
  #
  # Sizing, from measured L4 data (~15.5GB weights, ~0.21GB per 1k visual tokens,
  # so ~33k tokens to exhaust 22.5GB usable): at 4 images that needs ~8k tokens
  # per image, which is why the top rung is 10240 and not 4096.
  #
  # A rung above the image's native token count does nothing -- a 4K image is
  # ~10,550 tokens, so rungs beyond that stop binding. Going higher only helps
  # with 8K+ originals.
  qwen_visual_token_ladder: [40960, 20480, 10240, 8192, 6144, 4096, 2560, 1280]

  # InternVL tiles: 12 is the model's usual maximum, so rungs above it are
  # outside its tuned regime and captions may degrade before VRAM does -- which
  # is itself worth knowing.
  #
  # Note this ladder may legitimately never OOM. Tiles are capped by aspect
  # ratio, so a 16:9 image uses ~28 tiles even when 32 are allowed; reaching the
  # ~38k tokens an L4 needs would take ~45 tiles per image, which is far outside
  # anything you would actually run. "No boundary within the usable range" is a
  # real and useful stage-0 answer -- it means MMMU multi-image fits at full tile
  # budget -- and the sweep now reports it as such instead of as a boundary.
  internvl_tile_ladder: [256, 128, 96, 72, 64, 48, 40, 32, 24, 16, 12, 8, 6, 4, 2, 1]

# ----------------------------------------------------------------------------
# STAGE 0.2. Surface is defined now so the architecture is ready; unused while
# enabled: false. Both harnesses run the same tasks and their scores are
# compared -- deltas are expected and are the research output, not a bug.
# ----------------------------------------------------------------------------
eval:
  enabled: false
  max_new_tokens: 512

  harnesses:
    vlmevalkit:
      enabled: true
      venv: .venvs/vlmevalkit
      work_dir: results/vlmevalkit
    lmms_eval:
      enabled: true
      venv: .venvs/lmms_eval
      work_dir: results/lmms_eval

  # One row per benchmark, carrying BOTH harnesses' task IDs -- the two projects
  # name the same benchmark differently. This mapping is what makes the
  # cross-harness comparison meaningful, so it lives in config where it can be
  # corrected without touching code.
  tasks:
    - name: mmmu_val
      vlmevalkit: MMMU_DEV_VAL
      lmms_eval: mmmu_val
    - name: mathvista_testmini
      vlmevalkit: MathVista_MINI
      lmms_eval: mathvista_testmini

  limit: null                      # cap samples per task for quick smoke runs

  # MMMU and MathVista open-ended items need answer extraction. Decided at
  # stage 0.2; the shape is fixed now so the dependency is visible.
  judge:
    backend: none                  # none | api | local
    model: null
    api_key_env: null
